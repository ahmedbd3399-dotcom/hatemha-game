  apk:
    name: 📱 بناء APK
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تثبيت Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: إنشاء رابط الموقع
        id: site
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"

          echo "url=https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_OUTPUT"

      - name: إنشاء مشروع Android
        run: |
          mkdir -p twa
          cd twa

          bubblewrap init \
            --manifest="${{ steps.site.outputs.url }}manifest.json" \
            --directory="." \
            --yes

      - name: تجهيز Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: فحص Bubblewrap
        working-directory: twa
        run: bubblewrap doctor

      - name: بناء APK بدون توقيع تفاعلي
        working-directory: twa
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --skipSigning

      - name: البحث عن APK
        working-directory: twa
        run: |
          find . -name "*.apk" -type f -print

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: حطّمها-APK
          path: |
            twa/app-release-unsigned-aligned.apk
            twa/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
